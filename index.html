function loadState() {
  // Legacy: unused — Firebase listener handles state now
  return null;
}
function saveState(s) {
  // Write full game state to Firebase (shared across all devices)
  try { db.ref("game").set(s); } catch(e) { console.error(e); }
}
function initState() {
  const scores = {};
  VIAJEROS.forEach(v => { scores[v.id] = {total:0,cultura:0,gastronomia:0,aventura:0,naturaleza:0,foto:0,prediccion:0,curiosidad:0,correctas:0,respondidas:0}; });
  const avatars = {};
  VIAJEROS.forEach(v => { avatars[v.id] = null; });
  return {scores, avatars, diaActual:1, respuestasDia:{}, fotoVotos:{}, curVotos:{}, historial:[], initialized:true};
}

function App() {
  const [gs, setGs] = useState(null);
  const [screen, setScreen] = useState("loading");
  const [user, setUser] = useState(null);
  const [adminCode, setAdminCode] = useState("");
  const [pendingUser, setPendingUser] = useState(null);
  const [fotoUploading, setFotoUploading] = useState(false);
  const [fotoUploadError, setFotoUploadError] = useState(null);
  const [fotosDia, setFotosDia] = useState({});
  const [fotoVerDia, setFotoVerDia] = useState(null); // null = día actual
  const [fotoExpand, setFotoExpand] = useState(null); // índice de foto en lightbox
  const [qIdx, setQIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [done, setDone] = useState(false);
  const [timer, setTimer] = useState(20);
  const timerRef = useRef(null);
  const [predVal, setPredVal] = useState("");
  const [curVal, setCurVal] = useState("");
  const [bonusV, setBonusV] = useState(VIAJEROS[0].id);
  const [bonusPts, setBonusPts] = useState(100);
  const [bonusCat, setBonusCat] = useState("cultura");
  const [showHistCur, setShowHistCur] = useState(false);

  // Back button: intercept browser history to navegar dentro del app
  const screenRef = useRef(screen);
  const userRef   = useRef(user);
  useEffect(() => { screenRef.current = screen; }, [screen]);
  useEffect(() => { userRef.current = user; }, [user]);
  useEffect(() => {
    history.pushState({ triviaApp: true }, '');
    const handlePop = () => {
      const cur = screenRef.current;
      const SUB = ["trivia","foto","prediccion","curiosidad","ya_jugaste","trivia_done","admin","emoji_picker","ceremonia","leaderboard"];
      if (SUB.includes(cur)) {
        setScreen("menu");
      }
      // En menu o login: simplemente re-push para que nunca salga del app
      history.pushState({ triviaApp: true }, '');
    };
    window.addEventListener('popstate', handlePop);
    return () => window.removeEventListener('popstate', handlePop);
  }, []);

  useEffect(() => {
    // Real-time Firebase listener — fires on every change from any device
    const ref = db.ref("game");
    ref.on("value", (snapshot) => {
      const data = snapshot.val();
      let state = (data && data.initialized) ? data : initState();
      if (!data) db.ref("game").set(state); // first-time init

      // Auto-avanzar día según la fecha real del calendario
      // El viaje comienza el 19/06/2026 (Día 1)
      if (!state.ceremoniaActiva) {
        const inicio = new Date('2026-06-19T00:00:00');
        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        const diffDias = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
        const diaReal = Math.min(Math.max(1, diffDias + 1), 10);
        if (diaReal > state.diaActual) {
          // Rellenar historial para días que se saltaron sin pasar por admin
          if (!state.historial) state.historial = []; // Firebase drops empty arrays → null
          while (state.historial.length < diaReal - 1) {
            state.historial.push({ dia: state.historial.length + 1, ganador: null });
          }
          state = { ...state, diaActual: diaReal };
          db.ref("game").set(state);
        }
      }

      setGs(state);
      setScreen(prev => prev === "loading" ? "login" : prev);
    });

    // Fotos also synced via Firebase
    const fotosRef = db.ref("fotos");
    fotosRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) setFotosDia(data);
    });

    return () => { ref.off(); fotosRef.off(); };
  }, []);

  const update = (next) => { setGs(next); saveState(next); };

  useEffect(() => {
    // iOS WebKit reliable scroll reset: toggle overflow forces position recalc
    const root = document.getElementById('trivia-root');
    if (!root) return;
    root.style.overflowY = 'hidden';
    root.scrollTop = 0;
    requestAnimationFrame(() => {
      root.scrollTop = 0;
      root.style.overflowY = 'auto';
    });
  }, [screen]);

  useEffect(() => {
    if (screen !== "trivia" || showResult || done) return;
    setTimer(20);
    timerRef.current = setInterval(() => {
      setTimer(v => { if (v <= 1) { clearInterval(timerRef.current); answer(null); return 0; } return v-1; });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [screen, qIdx, showResult, done]);

  const preguntas = PREGUNTAS_T[gs?.diaActual] || [];

  const answer = (idx) => {
    clearInterval(timerRef.current);
    const q = preguntas[qIdx];
    const correct = idx === q.correcta;
    const pts = correct ? q.puntos : 0;
    setSel(idx); setShowResult(true);
    setTimeout(() => {
      const next = JSON.parse(JSON.stringify(gs));
      if (!next.scores) next.scores = {};
      if (!next.scores[user.id]) next.scores[user.id] = {total:0,correctas:0,respondidas:0};
      if (!next.respuestasDia) next.respuestasDia = {};
      if (correct) { next.scores[user.id].total += pts; next.scores[user.id][q.categoria] = (next.scores[user.id][q.categoria]||0)+pts; next.scores[user.id].correctas += 1; }
      next.scores[user.id].respondidas += 1;
      if (qIdx+1 >= preguntas.length) { next.respuestasDia[`trivia_${user.id}_d${gs.diaActual}`]=true; setDone(true); setShowResult(false); }
      else { setQIdx(i=>i+1); setSel(null); setShowResult(false); }
      update(next);
    }, 2200);
  };

  const votoFoto = (vid) => {
    const key = `foto_${user.id}_d${gs.diaActual}`;
    if ((gs.fotoVotos||{})[key]) return;
    const next = JSON.parse(JSON.stringify(gs));
    if (!next.fotoVotos) next.fotoVotos = {};
    if (!next.scores) next.scores = {};
    if (!next.scores[vid]) next.scores[vid] = {total:0,foto:0};
    next.fotoVotos[key]=vid; next.scores[vid].foto=(next.scores[vid].foto||0)+50; next.scores[vid].total+=50;
    update(next); setScreen("menu");
  };

  const enviarPred = () => {
    if (!predVal.trim()) return;
    const next = JSON.parse(JSON.stringify(gs));
    if (!next.respuestasDia) next.respuestasDia = {};
    next.respuestasDia[`pred_${user.id}_d${gs.diaActual}`]={valor:predVal,usuario:user.id};
    update(next); setPredVal(""); setScreen("menu");
  };

  const enviarCur = () => {
    if (!curVal.trim()) return;
    const next = JSON.parse(JSON.stringify(gs));
    if (!next.respuestasDia) next.respuestasDia = {};
    next.respuestasDia[`cur_${user.id}_d${gs.diaActual}`]={texto:curVal,usuario:user.id};
    update(next); setCurVal("");
    // No salir del screen — mostrar lista de curiosidades para votar
  };

  const votarCuriosidad = (autorId) => {
    const dia = gs.diaActual;
    const votoKey = `cur_${user.id}_d${dia}`;
    if ((gs.curVotos||{})[votoKey]) return; // ya votó
    if (autorId === user.id) return; // no puede votarse a sí mismo
    const next = JSON.parse(JSON.stringify(gs));
    if (!next.curVotos) next.curVotos = {};
    next.curVotos[votoKey] = autorId;
    // Contar si todos votaron → dar puntos
    const totalVotos = Object.keys(next.curVotos).filter(k => k.endsWith(`_d${dia}`)).length;
    if (totalVotos >= VIAJEROS.length) {
      // Contar votos por autor
      const conteo = {};
      Object.values(next.curVotos).filter((_, i) => Object.keys(next.curVotos)[i].endsWith(`_d${dia}`))
        .forEach(aId => { conteo[aId] = (conteo[aId]||0)+1; });
      // Ganador
      const ganadorId = Object.entries(conteo).sort((a,b)=>b[1]-a[1])[0]?.[0];
      if (ganadorId && next.scores?.[ganadorId] !== undefined) {
        if (!next.scores[ganadorId]) next.scores[ganadorId]={total:0,curiosidad:0};
        next.scores[ganadorId].curiosidad = (next.scores[ganadorId].curiosidad||0)+150;
        next.scores[ganadorId].total = (next.scores[ganadorId].total||0)+150;
      }
    }
    update(next);
  };

  const adminBonus = () => {
    const next = JSON.parse(JSON.stringify(gs));
    next.scores[bonusV].total+=bonusPts; next.scores[bonusV][bonusCat]=(next.scores[bonusV][bonusCat]||0)+bonusPts;
    update(next);
  };

  const adminAvanzar = () => {
    const next = JSON.parse(JSON.stringify(gs));
    const lb = leaderboard(next);
    if (!next.historial) next.historial = []; // Firebase drops empty arrays → null
    next.historial.push({dia:next.diaActual, ganador:lb[0]?.id, scores:JSON.parse(JSON.stringify(next.scores))});
    if (gs.diaActual >= 10) {
      // Viaje terminado — activa ceremonia
      next.ceremoniaActiva = true;
      update(next);
      setScreen("ceremonia");
    } else {
      next.diaActual += 1;
      update(next);
    }
  };

  const adminReset = () => {
    if (!window.confirm("¿Resetear TODO el juego a cero? Esto borra scores, respuestas e historial. Úsalo antes del 19 de junio.")) return;
    const fresh = initState();
    db.ref("game").set(fresh);
    db.ref("fotos").remove();
    setFotosDia({});
  };

  const leaderboard = (state=gs) => {
    if (!state) return [];
    return [...VIAJEROS].map(v=>({...v,pts:state.scores?.[v.id]?.total||0})).sort((a,b)=>b.pts-a.pts);
  };

  const catLeader = (cat) => {
    if (!gs) return null;
    return [...VIAJEROS].map(v=>({...v,pts:gs.scores?.[v.id]?.[cat]||0})).sort((a,b)=>b.pts-a.pts)[0];
  };

  if (screen==="loading" || !gs) return (
    <div style={P.page}><div style={P.loadBox}><div style={P.spinner}/><p style={P.loadTxt}>Cargando...</p></div></div>
  );

  if (screen==="emoji_picker" && pendingUser) {
    const already = gs.avatars?.[pendingUser.id];
    const takenEmojis = Object.entries(gs.avatars || {})
      .filter(([id, e]) => id !== pendingUser.id && e)
      .map(([, e]) => e);
    return (
      <div style={P.page}><div style={P.card}>
        <h2 style={{...P.cardTitle, color: pendingUser.color}}>Hola, {pendingUser.name}</h2>
        <p style={P.cardSub}>{already ? "Tu avatar actual es " + already + ". ¿Quieres cambiarlo?" : "Elige tu avatar para el viaje"}</p>
        <div style={P.emojiGrid}>
          {EMOJI_OPTIONS.map(e => {
            const taken = takenEmojis.includes(e) && e !== already;
            return (
              <button key={e}
                style={{...P.emojiBtn, opacity: taken ? 0.2 : 1,
                  background: e === already ? `rgba(${pendingUser.color},0.2)` : "rgba(255,255,255,0.05)",
                  border: e === already ? `2px solid ${pendingUser.color}` : "1.5px solid rgba(255,255,255,0.1)"
                }}
                disabled={taken}
                onClick={() => {
                  const next = JSON.parse(JSON.stringify(gs));
                  if (!next.avatars) next.avatars = {};
                  next.avatars[pendingUser.id] = e;
                  update(next);
                  const v = pendingUser;
                  setUser(v); setQIdx(0); setSel(null); setShowResult(false); setDone(false);
                  setPendingUser(null);
                  setScreen((next.respuestasDia||{})[`trivia_${v.id}_d${next.diaActual}`] ? "ya_jugaste" : "menu");
                }}>
                {e}
              </button>
            );
          })}
        </div>
        {already && (
          <button style={P.btnGold} onClick={() => {
            setUser(pendingUser); setQIdx(0); setSel(null); setShowResult(false); setDone(false);
            setPendingUser(null);
            setScreen((gs.respuestasDia||{})[`trivia_${pendingUser.id}_d${gs.diaActual}`] ? "ya_jugaste" : "menu");
          }}>Continuar con {already}</button>
        )}
        <button style={P.btnGray} onClick={() => { setPendingUser(null); setScreen("login"); }}>Cancelar</button>
      </div></div>
    );
  }

  if (screen==="login") {
    const dia = DIAS_T[(gs.diaActual||1)-1] || DIAS_T[0];
    return (
      <div style={P.page}>
        <div style={P.loginWrap}>
          <div style={P.loginHead}>
            <div style={P.bigEmoji}>{dia.emoji}</div>
            <h1 style={P.brand}>Familia González</h1>
            <p style={P.brandSub}>Asturias · Galicia · León · 2026</p>
            <div style={P.diaTag}>
              <span style={P.diaTagNum}>DÍA {gs.diaActual}</span>
              <span style={P.diaTagTxt}>{dia.titulo}</span>
              <span style={P.diaTagLug}>{dia.lugar}</span>
            </div>
          </div>
          <p style={P.loginQ}>Toca tu nombre para entrar</p>
          <div style={P.playerGrid}>
            {VIAJEROS.map(v=>(
              <button key={v.id} style={{...P.playerBtn, borderColor:v.color}}
                onClick={()=>{
                  setPendingUser(v);
                  setScreen("emoji_picker");
                }}>
                <span style={{...P.playerEmoji, color:v.color, fontSize:32, fontWeight:800}}>
                  {gs.avatars?.[v.id] || v.name[0]}
                </span>
                <span style={{...P.playerName,color:v.color}}>{v.name}</span>
              </button>
            ))}
          </div>
          <div style={P.adminRow}>
            <input style={P.adminInput} type="password" placeholder="Código admin" value={adminCode} onChange={e=>setAdminCode(e.target.value)}/>
            <button style={P.adminGo} onClick={()=>{
              if(adminCode==="asturias2026"){setUser({id:"admin",name:"Admin",emoji:"⚙️",color:"#888"});setScreen("admin");}
              else alert("Código incorrecto");
            }}>Admin</button>
          </div>
        </div>
      </div>
    );
  }

  if (screen==="ya_jugaste") {
    const lb=leaderboard();
    return (
      <div style={P.page}><div style={P.card}>
        <div style={P.cardEmoji}>✅</div>
        <h2 style={P.cardTitle}>¡Ya jugaste hoy, {user.name}!</h2>
        <p style={P.cardSub}>Tus respuestas están guardadas. Puedes ver el leaderboard o volver mañana.</p>
        <div style={P.miniLb}>
          {lb.slice(0,5).map((v,i)=>(
            <div key={v.id} style={P.miniLbRow}>
              <span style={P.rank}>{["🥇","🥈","🥉","4.","5."][i]}</span>
              <span style={{fontSize:24}}>{(gs?.avatars?.[v.id]) || v.name[0]}</span>
              <span style={{...P.rankName,color:v.color}}>{v.name}</span>
              <span style={P.rankPts}>{v.pts} pts</span>
            </div>
          ))}
        </div>
        <button style={P.btnGold} onClick={()=>setScreen("menu")}>Ver mis actividades</button>
        <button style={P.btnGray} onClick={()=>{setUser(null);setScreen("login");}}>Cambiar jugador</button>
      </div></div>
    );
  }

  if (screen==="menu") {
    if (!user) { setScreen("login"); return null; }
    const dia=DIAS_T[(gs.diaActual||1)-1] || DIAS_T[0];
    const trivDone=!!(gs.respuestasDia||{})[`trivia_${user.id}_d${gs.diaActual}`];
    const fotoHoyDone=!!(gs.fotoVotos||{})[`foto_${user.id}_d${gs.diaActual}`];
    const fotoPendientes = Array.from({length: gs.diaActual - 1}, (_,i)=>i+1).filter(d => {
      const k=`d${d}`;
      return (fotosDia[k]||[]).length > 0 && !(gs.fotoVotos||{})[`foto_${user.id}_${k}`];
    });
    const fotoDone = fotoHoyDone && fotoPendientes.length === 0;
    const fotoSub = fotoPendientes.length > 0
      ? `⚠️ ${fotoPendientes.length} día${fotoPendientes.length>1?'s':''} sin votar`
      : "Vota la mejor foto del grupo";
    const predDone=!!(gs.respuestasDia||{})[`pred_${user.id}_d${gs.diaActual}`];
    const curDone=!!(gs.respuestasDia||{})[`cur_${user.id}_d${gs.diaActual}`];
    const acts=[
      {emoji:"🎯",label:"Trivia del día",    sub:"5 preguntas · 20 seg c/u",       pts:"hasta 750 pts",      done:trivDone, go:()=>{setQIdx(0);setSel(null);setShowResult(false);setDone(false);setScreen("trivia");}},
      {emoji:"📸",label:"Foto del día",      sub:fotoSub,                           pts:"50 pts al ganador",  done:fotoDone, go:()=>{setFotoVerDia(null);setScreen("foto");}},
      {emoji:"🔮",label:"Predicción",        sub:"Adivina el número del día",       pts:"100 pts si aciertas",done:predDone, go:()=>setScreen("prediccion")},
      {emoji:"💡",label:"Dato curioso",      sub:"Comparte algo que descubriste",   pts:"voto → 150 pts",     done:curDone,  go:()=>setScreen("curiosidad")},
    ];
    return (
      <div style={P.page}><div style={P.menuWrap}>
        <div style={{...P.userHead,borderColor:user.color}}>
          <span style={{fontSize:44}}>{(gs?.avatars?.[user.id]) || user.name[0]}</span>
          <div style={{flex:1}}>
            <div style={{...P.userName,color:user.color}}>{user.name}</div>
            <div style={P.userPts}>{gs.scores?.[user.id]?.total||0} puntos acumulados</div>
          </div>
          <button style={P.lbBtn} onClick={()=>setScreen("leaderboard")}>🏆</button>
        </div>
        <div style={P.diaBar}>
          <span style={{fontSize:36,lineHeight:1}}>{dia.emoji}</span>
          <div>
            <div style={P.diaBarNum}>DÍA {gs.diaActual} · {dia.fecha}</div>
            <div style={P.diaBarTit}>{dia.titulo}</div>
            <div style={P.diaBarLug}>{dia.lugar}</div>
          </div>
        </div>
        <p style={P.secLabel}>ACTIVIDADES DE HOY</p>
        {acts.map((a,i)=>(
          <button key={i} style={{...P.actRow,opacity:a.done?0.5:1}} onClick={a.done?undefined:a.go} disabled={a.done}>
            <div style={P.actIcon}>{a.emoji}</div>
            <div style={P.actBody}>
              <div style={P.actLabel}>{a.label}</div>
              <div style={P.actSub}>{a.done?"Completada ✓":a.sub}</div>
            </div>
            {!a.done&&<div style={P.actPts}>{a.pts}</div>}
            <div style={P.actArrow}>{a.done?"✓":"›"}</div>
          </button>
        ))}
        <div style={{marginTop:20, padding:'14px 16px', background:'rgba(255,255,255,0.04)', borderRadius:14, border:'1px solid rgba(255,255,255,0.08)'}}>
          <div style={{fontSize:12, color:'#555', marginBottom:8, textAlign:'center'}}>¿Otro jugador quiere participar desde este teléfono?</div>
          <button style={{...P.btnGold, background:'transparent', border:'1.5px solid #C8963E', color:'#C8963E', width:'100%', fontSize:15}}
            onClick={()=>{setUser(null);setScreen("login");}}>
            🔄 Cambiar jugador
          </button>
        </div>
      </div></div>
    );
  }

  if (screen==="trivia") {
    if (done) return (
      <div style={P.page}><div style={P.card}>
        <div style={P.cardEmoji}>🎉</div>
        <h2 style={P.cardTitle}>¡Trivia completada!</h2>
        <div style={{...P.bigScore,color:user.color}}>{gs.scores?.[user.id]?.total||0}</div>
        <p style={P.cardSub}>puntos acumulados en el viaje</p>
        <button style={P.btnGold} onClick={()=>setScreen("menu")}>Volver al menú</button>
        <button style={P.btnGray} onClick={()=>setScreen("leaderboard")}>Ver leaderboard 🏆</button>
      </div></div>
    );
    const q=preguntas[qIdx];
    const cat=CATEGORIAS_T[q.categoria];
    const pct=(timer/20)*100;
    const tc=timer>12?"#2EAE85":timer>6?"#F7A200":"#E74C3C";
    return (
      <div style={P.page}><div style={P.triviaWrap}>
        <div style={P.triviaTop}>
          <div style={P.triviaTopRow}>
            <span style={{...P.catPill,background:cat.color}}>{cat.emoji} {cat.label}</span>
            <span style={P.triviaCount}>{qIdx+1}/{preguntas.length}</span>
          </div>
          <div style={P.timerTrack}><div style={{...P.timerBar,width:`${pct}%`,background:tc}}/></div>
          <div style={{...P.timerNum,color:tc}}>{timer}s</div>
        </div>
        <div style={P.qBox}>
          <p style={P.qText}>{q.texto}</p>
          <div style={P.ptsBadge}>+{q.puntos} pts si aciertas</div>
        </div>
        <div style={P.optsGrid}>
          {q.opciones.map((op,i)=>{
            const L=["A","B","C","D"];
            let bg="rgba(255,255,255,0.06)",border="1.5px solid rgba(255,255,255,0.12)";
            if(showResult){
              if(i===q.correcta){bg="rgba(46,174,133,0.25)";border="2px solid #2EAE85";}
              else if(i===sel&&i!==q.correcta){bg="rgba(231,76,60,0.25)";border="2px solid #E74C3C";}
            }
            return (
              <button key={i} style={{...P.optBtn,background:bg,border}} onClick={()=>{if(!showResult)answer(i);}} disabled={showResult}>
                <span style={P.optLetter}>{L[i]}</span>
                <span style={P.optText}>{op}</span>
                {showResult&&i===q.correcta&&<span style={{color:"#2EAE85",fontSize:22}}>✓</span>}
                {showResult&&i===sel&&i!==q.correcta&&<span style={{color:"#E74C3C",fontSize:22}}>✗</span>}
              </button>
            );
          })}
        </div>
        {showResult&&(
          <div style={{...P.feedback,background:sel===q.correcta?"rgba(46,174,133,0.18)":"rgba(231,76,60,0.18)",borderColor:sel===q.correcta?"#2EAE85":"#E74C3C"}}>
            {sel===q.correcta?`¡Correcto! +${q.puntos} puntos`:sel===null?"Se acabó el tiempo.":"No era esa. Sigue adelante."}
          </div>
        )}
      </div></div>
    );
  }

  if (screen==="foto") {
    const diaViendo   = fotoVerDia ?? gs.diaActual;
    const diaKey      = `d${diaViendo}`;
    const fotoKey     = `foto_${user.id}_${diaKey}`;
    const yaSubio     = !!(fotosDia[diaKey] || []).find(f => f.userId === user.id);
    const yaVoto      = !!(gs.fotoVotos||{})[fotoKey];
    const fotosDelDia = fotosDia[diaKey] || [];
    const votosEmitidos = VIAJEROS.filter(v => (gs.fotoVotos||{})[`foto_${v.id}_${diaKey}`]).length;
    const todosVotaron = votosEmitidos === VIAJEROS.length;
    const votosPorFoto = {};
    Object.entries(gs.fotoVotos||{}).forEach(([k, val]) => {
      if (!k.startsWith(`foto_`) || !k.endsWith(`_${diaKey}`)) return;
      if (typeof val === "number") { votosPorFoto[val] = (votosPorFoto[val] || 0) + 1; }
    });
    const maxVotos = Math.max(0, ...Object.values(votosPorFoto));
    const ganadorIdx = Object.entries(votosPorFoto).find(([,v]) => v === maxVotos)?.[0];

    // Días pasados donde hay fotos y el usuario no votó
    const diasConVotoPendiente = [];
    for (let d = 1; d < gs.diaActual; d++) {
      const k = `d${d}`;
      const tieneVoto = !!(gs.fotoVotos||{})[`foto_${user.id}_${k}`];
      const tieneFotos = (fotosDia[k] || []).length > 0;
      if (tieneFotos && !tieneVoto) diasConVotoPendiente.push(d);
    }

    const handleFileChange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      setFotoUploading(true);
      setFotoUploadError(null);
      try {
        const url = await uploadToCloudinary(file, diaViendo, user.id);
        const nuevaFoto = { url, userId: user.id, userName: user.name, ts: Date.now() };
        const nextFotos = { ...fotosDia };
        if (!nextFotos[diaKey]) nextFotos[diaKey] = [];
        nextFotos[diaKey] = [...nextFotos[diaKey], nuevaFoto];
        setFotosDia(nextFotos);
        db.ref("fotos").set(nextFotos);
      } catch {
        setFotoUploadError("Error al subir. Intenta de nuevo.");
      } finally {
        setFotoUploading(false);
      }
    };

    const handleVotoFotoBlind = (photoIdx) => {
      if (yaVoto) return;
      if (fotosDelDia[photoIdx]?.userId === user.id) return;
      const next = JSON.parse(JSON.stringify(gs));
      if (!next.fotoVotos) next.fotoVotos = {};
      next.fotoVotos[fotoKey] = photoIdx;
      update(next);
    };

    return (
      <div style={P.page}>

        {/* Lightbox */}
        {fotoExpand !== null && fotosDelDia[fotoExpand] && (
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.93)",
            zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16}}
            onClick={()=>setFotoExpand(null)}>
            <img src={fotosDelDia[fotoExpand].url}
              style={{maxWidth:"100%",maxHeight:"65vh",objectFit:"contain",borderRadius:10}}
              onClick={e=>e.stopPropagation()} />
            <div style={{color:"#ccc",fontSize:13,marginTop:10,textAlign:"center"}}>
              {todosVotaron
                ? `📸 ${fotosDelDia[fotoExpand].userName}`
                : `Foto ${fotoExpand + 1} de ${fotosDelDia.length}`}
              {todosVotaron && String(fotoExpand) === String(ganadorIdx) ? " 🏆" : ""}
            </div>
            {!yaVoto && fotosDelDia[fotoExpand]?.userId !== user.id && (
              <button style={{...P.btnGold, marginTop:14, fontSize:15}}
                onClick={e=>{e.stopPropagation();handleVotoFotoBlind(fotoExpand);setFotoExpand(null);}}>
                ✓ Votar esta foto
              </button>
            )}
            {yaVoto && (gs.fotoVotos||{})[fotoKey] === fotoExpand && (
              <div style={{...P.feedback,background:"rgba(46,174,133,0.15)",borderColor:"#2EAE85",
                fontSize:13,marginTop:12,maxWidth:280,textAlign:"center"}}>
                ✓ Esta es tu foto votada
              </div>
            )}
            <button style={{...P.btnGray, marginTop:8, fontSize:13}} onClick={()=>setFotoExpand(null)}>
              ✕ Cerrar
            </button>
          </div>
        )}

      <div style={P.card}>
        <div style={P.cardEmoji}>📸</div>
        <h2 style={P.cardTitle}>Foto del día</h2>

        {/* Selector de día — aparece si hay días pasados o si estamos viendo un día pasado */}
        {(diasConVotoPendiente.length > 0 || diaViendo !== gs.diaActual) && (
          <div style={{marginBottom:14}}>
            <p style={{...P.cardSub, fontSize:12, marginBottom:8}}>
              {diasConVotoPendiente.length > 0 ? `⚠️ Tienes votos pendientes en días anteriores` : ""}
            </p>
            <div style={{display:"flex", gap:6, flexWrap:"wrap", justifyContent:"center"}}>
              <button
                onClick={() => setFotoVerDia(null)}
                style={{fontSize:12, padding:"5px 12px", borderRadius:20, border:"none", cursor:"pointer",
                  background: diaViendo === gs.diaActual ? "#C8963E" : "rgba(255,255,255,0.1)",
                  color: diaViendo === gs.diaActual ? "#000" : "#ccc", fontWeight:600}}>
                Día {gs.diaActual} (hoy)
              </button>
              {diasConVotoPendiente.map(d => (
                <button key={d}
                  onClick={() => setFotoVerDia(d)}
                  style={{fontSize:12, padding:"5px 12px", borderRadius:20, border:"1.5px solid #C8963E", cursor:"pointer",
                    background: diaViendo === d ? "#C8963E" : "transparent",
                    color: diaViendo === d ? "#000" : "#C8963E", fontWeight:600}}>
                  Día {d} ✗
                </button>
              ))}
            </div>
          </div>
        )}

        {diaViendo === gs.diaActual && (
          <div style={P.fotoUploadBox}>
            <p style={{...P.cardSub, marginBottom: 6}}>Sube tu mejor foto del día</p>
            {yaSubio && (
              <div style={{...P.feedback, background:"rgba(46,174,133,0.12)", borderColor:"#2EAE85", fontSize:13}}>
                ✓ Tu foto está subida
              </div>
            )}
            <label style={{...P.btnGold, display:"flex", alignItems:"center", justifyContent:"center", gap:8,
              cursor: fotoUploading ? "default" : "pointer", opacity: fotoUploading ? 0.6 : 1}}>
              {fotoUploading ? "Subiendo..." : yaSubio ? "Cambiar mi foto" : "📷  Subir mi foto"}
              <input type="file" accept="image/*"
                style={{display:"none"}} onChange={handleFileChange} disabled={fotoUploading} />
            </label>
            {fotoUploadError && (
              <p style={{color:"#E74C3C", fontSize:13, textAlign:"center", margin:0}}>{fotoUploadError}</p>
            )}
          </div>
        )}
        {fotosDelDia.length > 0 && (
          <div style={P.galeria}>
            <div style={P.galeriaHeader}>
              <p style={P.secLabel}>
                {fotosDelDia.length} FOTO{fotosDelDia.length > 1 ? "S" : ""} · {votosEmitidos}/{VIAJEROS.length} VOTOS
              </p>
              {todosVotaron
                ? <span style={P.revealBadge}>¡Reveladas!</span>
                : <span style={P.blindBadge}>Votación anónima</span>
              }
            </div>
            <div style={P.galeriaGrid}>
              {fotosDelDia.map((f, i) => {
                const esLaMia    = f.userId === user.id;
                const yaVoteEsta = (gs.fotoVotos||{})[fotoKey] === i;
                const votosEsta  = votosPorFoto[i] || 0;
                const esGanadora = todosVotaron && String(i) === String(ganadorIdx);
                return (
                  <div key={i} style={{...P.galeriaItem, border: esGanadora ? `2px solid #C8963E` : "2px solid transparent", borderRadius:14}}>
                    <div style={{position:"relative"}} onClick={()=>setFotoExpand(i)}>
                      <img src={f.url} alt={`Foto ${i+1}`} style={{...P.galeriaImg, cursor:"pointer"}} />
                      <div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.5)",borderRadius:20,
                        padding:"2px 7px",fontSize:11,color:"#fff",pointerEvents:"none"}}>🔍</div>
                      <div style={P.fotoOverlay}>
                        {todosVotaron
                          ? <span style={{...P.fotoLabel, color: VIAJEROS.find(v=>v.id===f.userId)?.color || "#fff"}}>
                              {(gs?.avatars?.[f.userId]) || ""} {f.userName}
                            </span>
                          : <span style={P.fotoLabel}>Foto {i + 1}</span>
                        }
                        {esGanadora && <span style={P.coronaBadge}>🏆</span>}
                      </div>
                    </div>
                    {!todosVotaron && (
                      esLaMia
                        ? <span style={P.esLaMia}>Es la tuya</span>
                        : yaVoto
                          ? <span style={{...P.esLaMia, color: yaVoteEsta ? "#C8963E" : "#555"}}>
                              {yaVoteEsta ? "✓ Tu voto" : ""}
                            </span>
                          : <button style={P.voteFotoBtn} onClick={() => handleVotoFotoBlind(i)}>
                              Votar esta
                            </button>
                    )}
                    {todosVotaron && (
                      <span style={{...P.esLaMia, color:"#C8963E"}}>
                        {votosEsta} voto{votosEsta !== 1 ? "s" : ""}
                        {esGanadora ? " 🏆" : ""}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
            {!todosVotaron && !yaVoto && fotosDelDia.length > 0 && !fotosDelDia.every(f => f.userId === user.id) && (
              <p style={{...P.cardSub, fontSize:12}}>
                Vota la mejor foto — no sabrás de quién es hasta que todos voten.
              </p>
            )}
            {!todosVotaron && yaVoto && (
              <div style={{...P.feedback, background:"rgba(46,174,133,0.12)", borderColor:"#2EAE85", fontSize:13}}>
                ✓ Voto registrado. Se revela cuando los {VIAJEROS.length} hayan votado ({votosEmitidos} de {VIAJEROS.length}).
              </div>
            )}
            {todosVotaron && (
              <div style={{...P.feedback, background:"rgba(200,150,62,0.15)", borderColor:"#C8963E", fontSize:14}}>
                🎉 ¡Todos votaron! Ganador: {fotosDelDia[ganadorIdx]?.userName}
              </div>
            )}
          </div>
        )}
        <button style={P.btnGray} onClick={() => setScreen("menu")}>Volver al menú</button>
      </div></div>
    );
  }

  if (screen==="prediccion") {
    const predKey = `pred_${user.id}_d${gs.diaActual}`;
    const yaPredije = !!(gs.respuestasDia||{})[predKey];
    const todasPreds = VIAJEROS.map(v => {
      const k = `pred_${v.id}_d${gs.diaActual}`;
      const r = (gs.respuestasDia||{})[k];
      return r ? {viajero:v, valor:r.valor} : null;
    }).filter(Boolean);
    return (
      <div style={P.page}><div style={P.card}>
        <div style={P.cardEmoji}>🔮</div>
        <h2 style={P.cardTitle}>Predicción del día</h2>
        <p style={P.cardSub}>{PREDICCIONES_T[gs.diaActual]}</p>

        {!yaPredije ? (
          <>
            <input style={P.textInput} placeholder="Tu respuesta..." value={predVal}
              onChange={e=>setPredVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&enviarPred()}/>
            <p style={{...P.cardSub,fontSize:12}}>El más cercano al final del día gana 100 pts.</p>
            <button style={P.btnGold} onClick={enviarPred}>Enviar predicción</button>
          </>
        ) : (
          <div style={{...P.feedback, background:"rgba(46,174,133,0.12)", borderColor:"#2EAE85", fontSize:13, marginBottom:12}}>
            ✓ Tu predicción: <strong>{(gs.respuestasDia||{})[predKey]?.valor}</strong>
          </div>
        )}

        {todasPreds.length > 0 && (
          <div style={{marginTop:16}}>
            <p style={P.secLabel}>RESPUESTAS DEL GRUPO ({todasPreds.length}/{VIAJEROS.length})</p>
            {todasPreds.map(({viajero, valor}) => (
              <div key={viajero.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                background:"rgba(255,255,255,0.04)",borderRadius:10,marginBottom:6,
                border:`1.5px solid rgba(${viajero.color.replace('#','').match(/../g).map(h=>parseInt(h,16)).join(',')},0.3)`}}>
                <span style={{fontSize:22}}>{(gs.avatars?.[viajero.id]) || "🎯"}</span>
                <span style={{color:viajero.color,fontWeight:700,fontSize:14,flex:1}}>{viajero.name}</span>
                <span style={{color:"#ddd",fontSize:15,fontWeight:600}}>{valor}</span>
              </div>
            ))}
            {todasPreds.length < VIAJEROS.length && (
              <p style={{...P.cardSub,fontSize:11,textAlign:"center",marginTop:6}}>
                Faltan {VIAJEROS.length - todasPreds.length} por responder
              </p>
            )}
          </div>
        )}

        <button style={{...P.btnGray,marginTop:16}} onClick={()=>setScreen("menu")}>Volver al menú</button>
      </div></div>
    );
  }

  if (screen==="curiosidad") {
    const dia = gs.diaActual;
    const miKey = `cur_${user.id}_d${dia}`;
    const yaEnvie = !!(gs.respuestasDia||{})[miKey];
    const miVotoKey = `cur_${user.id}_d${dia}`;
    const yaVote = !!(gs.curVotos||{})[miVotoKey];
    const todasCurs = VIAJEROS.map(v => {
      const k = `cur_${v.id}_d${dia}`;
      const r = (gs.respuestasDia||{})[k];
      return r ? {viajero:v, texto:r.texto} : null;
    }).filter(Boolean);
    const votosEmitidos = VIAJEROS.filter(v => (gs.curVotos||{})[`cur_${v.id}_d${dia}`]).length;
    const todosVotaron = votosEmitidos >= VIAJEROS.length;
    const conteoCurVotos = {};
    Object.entries(gs.curVotos||{}).forEach(([k,aId]) => {
      if (k.endsWith(`_d${dia}`)) conteoCurVotos[aId] = (conteoCurVotos[aId]||0)+1;
    });
    const maxCurVotos = Math.max(0,...Object.values(conteoCurVotos));
    return (
      <div style={P.page}><div style={P.card}>
        <div style={P.cardEmoji}>💡</div>
        <h2 style={P.cardTitle}>Dato curioso</h2>

        {!yaEnvie ? (
          <>
            <p style={P.cardSub}>Algo interesante que descubriste hoy. El grupo vota el mejor — ganador: 150 pts.</p>
            <textarea style={P.textarea} placeholder="Escribe aquí..." value={curVal}
              onChange={e=>setCurVal(e.target.value)} rows={4}/>
            <button style={P.btnGold} onClick={enviarCur}>Enviar dato</button>
          </>
        ) : (
          <div style={{...P.feedback, background:"rgba(46,174,133,0.12)", borderColor:"#2EAE85", fontSize:13, marginBottom:4}}>
            ✓ Tu dato: <em>{(gs.respuestasDia||{})[miKey]?.texto}</em>
          </div>
        )}

        {todasCurs.length > 0 && (
          <div style={{marginTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <p style={P.secLabel}>DATOS DEL GRUPO ({todasCurs.length}/{VIAJEROS.length})</p>
              {todosVotaron
                ? <span style={P.revealBadge}>¡Revelados!</span>
                : <span style={P.blindBadge}>Anónimo</span>
              }
            </div>
            {todasCurs.map(({viajero, texto}, i) => {
              const esElMio = viajero.id === user.id;
              const yaVoteEste = (gs.curVotos||{})[miVotoKey] === viajero.id;
              const votos = conteoCurVotos[viajero.id] || 0;
              const esGanador = todosVotaron && votos === maxCurVotos && maxCurVotos > 0;
              return (
                <div key={viajero.id} style={{background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"12px 14px",
                  marginBottom:8, border: esGanador ? "1.5px solid #C8963E" : "1px solid rgba(255,255,255,0.08)"}}>
                  <p style={{color:"#ddd",fontSize:14,margin:"0 0 8px",lineHeight:1.5}}>
                    {esGanador ? "🏆 " : "💡 "}{texto}
                  </p>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <span style={{fontSize:12,color: todosVotaron ? viajero.color : "#555"}}>
                      {todosVotaron ? `${(gs.avatars?.[viajero.id])||""} ${viajero.name}` : `Dato ${i+1}`}
                    </span>
                    {!todosVotaron && (
                      esElMio
                        ? <span style={{fontSize:11,color:"#555"}}>Es el tuyo</span>
                        : yaVote
                          ? <span style={{fontSize:11,color: yaVoteEste ? "#C8963E":"#555"}}>
                              {yaVoteEste ? "✓ Tu voto" : ""}
                            </span>
                          : yaEnvie
                            ? <button style={{...P.voteFotoBtn, fontSize:12, padding:"4px 10px"}}
                                onClick={()=>votarCuriosidad(viajero.id)}>
                                Votar
                              </button>
                            : null
                    )}
                    {todosVotaron && (
                      <span style={{fontSize:12,color: esGanador ? "#C8963E":"#888"}}>
                        {votos} voto{votos!==1?"s":""}
                        {esGanador?" 🏆":""}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
            {!todosVotaron && !yaVote && yaEnvie && todasCurs.length > 1 && (
              <p style={{...P.cardSub,fontSize:11,textAlign:"center"}}>
                Vota el más interesante · anónimo hasta que todos voten ({votosEmitidos}/{VIAJEROS.length})
              </p>
            )}
            {!yaEnvie && todasCurs.length > 0 && (
              <p style={{...P.cardSub,fontSize:11,textAlign:"center"}}>
                Envía tu dato primero para poder votar
              </p>
            )}
            {todosVotaron && (
              <div style={{...P.feedback,background:"rgba(200,150,62,0.15)",borderColor:"#C8963E",fontSize:13,marginTop:4}}>
                🎉 ¡Revelado! Ganador: {VIAJEROS.find(v=>conteoCurVotos[v.id]===maxCurVotos&&maxCurVotos>0)?.name}
              </div>
            )}
          </div>
        )}

        {/* Historial de días anteriores */}
        {gs.diaActual > 1 && (
          <div style={{marginTop:20}}>
            <button style={{...P.btnGray, fontSize:13, padding:"8px 16px"}}
              onClick={()=>setShowHistCur(v=>!v)}>
              {showHistCur ? "▲ Ocultar días anteriores" : "▼ Ver días anteriores"}
            </button>
            {showHistCur && (
              <div style={{marginTop:14}}>
                {Array.from({length: gs.diaActual - 1}, (_,i) => i+1).reverse().map(d => {
                  const cursDelDia = VIAJEROS.map(v => {
                    const k = `cur_${v.id}_d${d}`;
                    const r = (gs.respuestasDia||{})[k];
                    return r ? {viajero:v, texto:r.texto} : null;
                  }).filter(Boolean);
                  if (cursDelDia.length === 0) return null;
                  // Contar votos de ese día
                  const conteo = {};
                  Object.entries(gs.curVotos||{}).forEach(([k, aId]) => {
                    if (k.endsWith(`_d${d}`)) conteo[aId] = (conteo[aId]||0)+1;
                  });
                  const maxV = Math.max(0, ...Object.values(conteo));
                  const NOMBRES_DIA = ['Oviedo llegada','Covadonga','Senda del Oso','Lastres & Piloña','Santiago','Gijón llegada','Gijón ciudad','Llanes & Sella','León llegada','León despedida'];
                  return (
                    <div key={d} style={{marginBottom:18}}>
                      <p style={{...P.secLabel, marginBottom:8}}>DÍA {d} · {(NOMBRES_DIA[d-1]||'').toUpperCase()}</p>
                      {cursDelDia.map(({viajero, texto}) => {
                        const votos = conteo[viajero.id] || 0;
                        const esGanador = votos === maxV && maxV > 0;
                        return (
                          <div key={viajero.id} style={{background:"rgba(255,255,255,0.04)",borderRadius:12,
                            padding:"11px 13px",marginBottom:7,
                            border: esGanador ? "1.5px solid #C8963E" : "1px solid rgba(255,255,255,0.08)"}}>
                            <p style={{color:"#ddd",fontSize:14,margin:"0 0 7px",lineHeight:1.5}}>
                              {esGanador ? "🏆 " : "💡 "}{texto}
                            </p>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                              <span style={{fontSize:12,color:viajero.color}}>
                                {(gs.avatars?.[viajero.id])||""} {viajero.name}
                              </span>
                              <span style={{fontSize:12,color: esGanador ? "#C8963E":"#888"}}>
                                {votos} voto{votos!==1?"s":""}
                                {esGanador?" 🏆":""}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        <button style={{...P.btnGray,marginTop:16}} onClick={()=>setScreen("menu")}>Volver al menú</button>
      </div></div>
    );
  }

  if (screen==="leaderboard") {
    const lb=leaderboard();
    return (
      <div style={P.page}><div style={P.lbWrap}>
        <h2 style={P.lbTitle}>🏆 Leaderboard</h2>
        <p style={P.lbSub}>Día {gs.diaActual} · Puntajes acumulados</p>
        {lb.length>=3&&(
          <div style={P.podio}>
            {[lb[1],lb[0],lb[2]].map((v,i)=>{
              const h=["80px","100px","70px"],medals=["🥈","🥇","🥉"];
              return (
                <div key={v.id} style={{...P.podioCol,height:h[i]}}>
                  <span style={{fontSize:30}}>{(gs?.avatars?.[v.id]) || v.name[0]}</span>
                  <span style={{...P.podioName,color:v.color}}>{v.name}</span>
                  <span style={P.podioPts}>{v.pts} pts</span>
                  <span style={{fontSize:24}}>{medals[i]}</span>
                </div>
              );
            })}
          </div>
        )}
        {lb.map((v,i)=>(
          <div key={v.id} style={{...P.lbRow,background:i===0?"rgba(200,150,62,0.15)":"rgba(255,255,255,0.03)"}}>
            <span style={P.lbRank}>{i+1}</span>
            <span style={{fontSize:26}}>{(gs?.avatars?.[v.id]) || v.name[0]}</span>
            <span style={{...P.lbName,color:v.color}}>{v.name}</span>
            <span style={P.lbPts}>{v.pts} pts</span>
          </div>
        ))}
        <p style={{...P.secLabel,marginTop:20}}>LÍDERES POR CATEGORÍA</p>
        {Object.entries(CATEGORIAS_T).map(([key,cat])=>{
          const leader=catLeader(key), pts=leader?gs.scores?.[leader.id]?.[key]||0:0;
          return (
            <div key={key} style={P.catRow}>
              <span style={{...P.catPill,background:cat.color,fontSize:12}}>{cat.emoji} {cat.label}</span>
              {leader&&pts>0?<span style={{color:leader.color,fontWeight:700}}>{(gs?.avatars?.[leader.id]) || ""} {leader.name} · {pts} pts</span>:<span style={{color:"#555"}}>Sin puntos aún</span>}
            </div>
          );
        })}
        {(gs.historial||[]).length>0&&(
          <>
            <p style={{...P.secLabel,marginTop:20}}>GANADORES DIARIOS</p>
            {(gs.historial||[]).map(h=>{
              const gv=VIAJEROS.find(v=>v.id===h.ganador);
              return <div key={h.dia} style={P.histRow}><span style={P.histDia}>Día {h.dia}</span>{gv?<span style={{color:gv.color}}>{(gs?.avatars?.[gv.id]) || ""} {gv.name}</span>:<span style={{color:"#555"}}>—</span>}</div>;
            })}
          </>
        )}
        <button style={{...P.btnGray,marginTop:16}} onClick={()=>setScreen(user?"menu":"login")}>Volver</button>
      </div></div>
    );
  }

  if (screen==="admin") {
    const lb=leaderboard();
    return (
      <div style={P.page}><div style={P.adminWrap}>
        <h2 style={P.lbTitle}>⚙️ Panel Admin</h2>
        <p style={P.lbSub}>Día {gs.diaActual} — {DIAS_T[gs.diaActual-1]?.titulo}</p>
        <div style={P.adminSec}>
          <p style={P.adminSecTit}>Avanzar al siguiente día</p>
          <p style={P.adminSecSub}>Registra el ganador del día y abre el siguiente.</p>
          <button style={{...P.btnGold, background: gs.diaActual>=10 ? "#7b1a1a" : "#c0392b"}} onClick={adminAvanzar}>
            {gs.diaActual >= 10 ? "🏆 Cerrar viaje y abrir ceremonia" : `Cerrar Día ${gs.diaActual} → Abrir Día ${gs.diaActual+1}`}
          </button>
        </div>
        <div style={P.adminSec}>
          <p style={P.adminSecTit}>Asignar puntos bonus</p>
          <select style={P.sel} value={bonusV} onChange={e=>setBonusV(e.target.value)}>
            {VIAJEROS.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
          </select>
          <select style={P.sel} value={bonusCat} onChange={e=>setBonusCat(e.target.value)}>
            <option value="cultura">🏛️ Cultura</option>
            <option value="gastronomia">🍽️ Gastronomía</option>
            <option value="aventura">🧭 Aventura</option>
            <option value="prediccion">🔮 Predicción</option>
            <option value="curiosidad">💡 Curiosidad</option>
            <option value="foto">📸 Foto</option>
          </select>
          <input style={P.textInput} type="number" value={bonusPts} onChange={e=>setBonusPts(Number(e.target.value))}/>
          <button style={P.btnGold} onClick={adminBonus}>Asignar {bonusPts} pts</button>
        </div>
        <div style={P.adminSec}>
          <p style={P.adminSecTit}>Predicciones enviadas hoy</p>
          {VIAJEROS.map(v=>{const e=(gs.respuestasDia||{})[`pred_${v.id}_d${gs.diaActual}`];return e?(<div key={v.id} style={P.adminEntry}><span style={{color:v.color,fontWeight:700}}>{v.name}:</span> {e.valor}</div>):null;})}
        </div>
        <div style={P.adminSec}>
          <p style={P.adminSecTit}>Datos curiosos de hoy</p>
          {VIAJEROS.map(v=>{const e=(gs.respuestasDia||{})[`cur_${v.id}_d${gs.diaActual}`];return e?(<div key={v.id} style={P.adminEntry}><span style={{color:v.color,fontWeight:700}}>{v.name}:</span> {e.texto}</div>):null;})}
        </div>
        <div style={P.adminSec}>
          <p style={P.adminSecTit}>Puntajes actuales</p>
          {lb.map((v,i)=>(
            <div key={v.id} style={{...P.lbRow,padding:"10px 0"}}>
              <span style={P.lbRank}>{i+1}</span>
              <span style={{...P.lbName,color:v.color}}>{v.name}</span><span style={P.lbPts}>{v.pts} pts</span>
            </div>
          ))}
        </div>
        <div style={{...P.adminSec, borderTop:"1px solid #c0392b", marginTop:8}}>
          <p style={{...P.adminSecTit, color:"#c0392b"}}>⚠️ Zona de peligro</p>
          <p style={P.adminSecSub}>Resetea todos los scores a cero. Úsalo la mañana del 19 de junio antes de que arranque el viaje.</p>
          <button style={{...P.btnGold, background:"#7b1a1a", border:"1px solid #c0392b"}} onClick={adminReset}>
            🗑️ Resetear juego completo
          </button>
        </div>
        <button style={P.btnGray} onClick={()=>{setUser(null);setScreen("login");}}>Cerrar sesión admin</button>
      </div></div>
    );
  }

  if (screen==="ceremonia") {
    const lb = leaderboard();
    const topCat = (cat) => {
      if (!gs) return null;
      return [...VIAJEROS].map(v=>({...v, pts: gs.scores?.[v.id]?.[cat]||0})).sort((a,b)=>b.pts-a.pts)[0];
    };
    const trofeos = [
      { emoji:'🏆', nombre:'Trofeo Pelayo',       sub:'Mayor puntaje total del viaje',      winner: lb[0] },
      { emoji:'🏛️', nombre:'Mente de Oviedo',     sub:'Cultura',                            winner: topCat('cultura') },
      { emoji:'🍽️', nombre:'Cuchara de Oro',      sub:'Gastronomía',                        winner: topCat('gastronomia') },
      { emoji:'🧭', nombre:'Espíritu del Camino', sub:'Aventura',                           winner: topCat('aventura') },
      { emoji:'🌿', nombre:'Alma de los Picos',   sub:'Naturaleza',                         winner: topCat('naturaleza') },
      { emoji:'📸', nombre:'Ojo del Cantábrico',  sub:'Fotografía',                         winner: topCat('foto') },
    ];
    return (
      <div style={{...P.page, background:'linear-gradient(160deg,#0a0800 0%,#1a1200 60%,#0a0800 100%)', flexDirection:'column', alignItems:'center', paddingTop:40}}>
        <div style={{textAlign:'center', marginBottom:32}}>
          <div style={{fontSize:64, marginBottom:8}}>🏆</div>
          <div style={{fontFamily:"'Playfair Display',serif", fontSize:32, color:'#C8963E', fontWeight:700}}>El Camino de los González</div>
          <div style={{color:'#888', fontSize:14, marginTop:4, letterSpacing:'0.1em'}}>CEREMONIA DE PREMIACIÓN · ASTURIAS 2026</div>
        </div>

        {trofeos.map((t,i) => (
          <div key={i} style={{width:'100%', maxWidth:460, background:'rgba(200,150,62,0.08)', border:`1px solid ${t.winner?.color||'#C8963E'}44`, borderRadius:16, padding:'18px 20px', marginBottom:12, display:'flex', alignItems:'center', gap:14}}>
            <div style={{fontSize:36, minWidth:44, textAlign:'center'}}>{t.emoji}</div>
            <div style={{flex:1}}>
              <div style={{color:'#C8963E', fontSize:13, fontWeight:700, letterSpacing:'0.05em'}}>{t.nombre}</div>
              <div style={{color:'#555', fontSize:11, marginTop:1}}>{t.sub}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{color: t.winner?.color||'#e8e8e8', fontWeight:700, fontSize:18}}>{t.winner ? (gs?.avatars?.[t.winner.id]||'') + ' ' + t.winner.name : '—'}</div>
              <div style={{color:'#C8963E', fontSize:13}}>{t.winner?.pts||0} pts</div>
            </div>
          </div>
        ))}

        <div style={{marginTop:24, textAlign:'center'}}>
          <div style={{color:'#555', fontSize:13, marginBottom:8}}>⭐ Estrellas del Día</div>
          {(gs?.historial||[]).map((h,i)=>{
            const v = VIAJEROS.find(x=>x.id===h.ganador);
            return v ? (
              <div key={i} style={{color:'#888', fontSize:13, marginBottom:4}}>
                Día {h.dia} — <span style={{color:v.color, fontWeight:600}}>{v.name}</span>
              </div>
            ) : null;
          })}
        </div>

        <div style={{marginTop:32, fontSize:13, color:'#444', textAlign:'center', fontStyle:'italic'}}>
          "El camino siempre continúa."
        </div>
        <button style={{...P.btnGray, marginTop:24}} onClick={()=>setScreen("leaderboard")}>Ver leaderboard completo</button>
      </div>
    );
  }

  // Auto-mostrar ceremonia si el juego terminó y el usuario entra
  if (gs?.ceremoniaActiva && screen === "menu") {
    return (
      <div style={P.page}><div style={P.card}>
        <div style={{fontSize:48, textAlign:'center'}}>🏆</div>
        <h2 style={{...P.cardTitle, color:'#C8963E', textAlign:'center'}}>¡El viaje terminó!</h2>
        <p style={{...P.cardSub, textAlign:'center'}}>La ceremonia de premiación está lista.</p>
        <button style={P.btnGold} onClick={()=>setScreen("ceremonia")}>Ver premios 🏆</button>
        <button style={P.btnGray} onClick={()=>setScreen("leaderboard")}>Solo el leaderboard</button>
      </div></div>
    );
  }

  return null;
}

const P = {
  page:{minHeight:"100vh",background:"linear-gradient(160deg,#0a0f1e 0%,#111827 60%,#0a0f1e 100%)",display:"flex",justifyContent:"center",alignItems:"flex-start",padding:"20px 14px 60px",fontFamily:"'Georgia',serif",color:"#e8e8e8",boxSizing:"border-box"},
  loadBox:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:16},
  spinner:{width:44,height:44,border:"3px solid rgba(255,255,255,0.08)",borderTop:"3px solid #C8963E",borderRadius:"50%",animation:"spin 1s linear infinite"},
  loadTxt:{color:"#888",fontSize:15},
  loginWrap:{width:"100%",maxWidth:480,display:"flex",flexDirection:"column",gap:0},
  loginHead:{textAlign:"center",padding:"28px 0 24px",borderBottom:"1px solid rgba(255,255,255,0.07)",marginBottom:20},
  bigEmoji:{fontSize:64,lineHeight:1,marginBottom:10},
  brand:{fontSize:26,fontWeight:700,color:"#C8963E",margin:"0 0 4px",letterSpacing:"-0.5px"},
  brandSub:{color:"#555",fontSize:13,margin:"0 0 20px"},
  diaTag:{display:"inline-flex",flexDirection:"column",gap:3,background:"rgba(200,150,62,0.1)",border:"1px solid rgba(200,150,62,0.25)",borderRadius:14,padding:"12px 24px"},
  diaTagNum:{fontSize:10,fontWeight:700,letterSpacing:2,color:"#C8963E"},
  diaTagTxt:{fontSize:16,fontWeight:700,color:"#e8e8e8"},
  diaTagLug:{fontSize:12,color:"#666"},
  loginQ:{textAlign:"center",fontSize:16,color:"#888",margin:"20px 0 12px"},
  playerGrid:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:14},
  playerBtn:{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"22px 8px",background:"rgba(255,255,255,0.04)",border:"2px solid",borderRadius:18,cursor:"pointer"},
  playerEmoji:{fontSize:44},
  playerName:{fontSize:17,fontWeight:700},
  adminRow:{display:"flex",gap:8,marginTop:4},
