<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asturias · Concierge Privado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1a4a3a;
    --verde-claro: #2d6b54;
    --crema: #f5f0e8;
    --dorado: #c8963e;
    --dorado-claro: #e8b96a;
    --blanco: #fdfaf5;
    --gris: #6b6560;
    --texto: #1c1a17;
    --sombra: rgba(26,74,58,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    color: var(--texto);
    height: 100%;
    overflow-x: hidden;
  }

  .header {
    background: var(--verde);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px var(--sombra);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
  }

  .logo-area h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--crema);
    letter-spacing: 0.02em;
  }

  .logo-area p {
    font-size: 0.65rem;
    color: var(--dorado-claro);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .fecha-hoy {
    background: rgba(200,150,62,0.2);
    border: 1px solid var(--dorado);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.7rem;
    color: var(--dorado-claro);
  }

  .nav-dias {
    display: flex;
    overflow-x: auto;
    background: var(--verde-claro);
    scrollbar-width: none;
    padding: 0 4px;
  }
  .nav-dias::-webkit-scrollbar { display: none; }

  .nav-btn {
    flex-shrink: 0;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: rgba(245,240,232,0.6);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .nav-btn:hover { color: var(--crema); }
  .nav-btn.active { color: var(--dorado-claro); border-bottom-color: var(--dorado); }

  .dia-hero {
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-claro) 100%);
    padding: 22px 20px 18px;
    position: relative;
    overflow: hidden;
  }

  .dia-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(200,150,62,0.08);
  }

  .dia-numero {
    font-size: 0.65rem;
    color: var(--dorado-claro);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .dia-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--blanco);
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .dia-fecha {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,240,232,0.12);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.7rem;
    color: var(--crema);
  }

  .horario-pill {
    display: inline-flex;
    align-items: center;
    background: rgba(200,150,62,0.15);
    border: 1px solid rgba(200,150,62,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.68rem;
    color: var(--dorado-claro);
    margin-left: 8px;
  }

  .contenido {
    padding: 14px 14px 120px;
    max-width: 600px;
    margin: 0 auto;
  }

  .hotel-card {
    background: var(--verde);
    border-radius: 14px;
    padding: 13px 15px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .hotel-icon {
    width: 36px; height: 36px;
    background: rgba(200,150,62,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .hotel-info p:first-child {
    font-size: 0.62rem;
    color: var(--dorado-claro);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .hotel-info strong {
    font-size: 0.85rem;
    color: var(--crema);
    font-weight: 500;
  }

  .hotel-info span {
    display: block;
    font-size: 0.7rem;
    color: rgba(245,240,232,0.55);
    margin-top: 1px;
  }

  .seccion { margin-bottom: 12px; }

  .seccion-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .seccion-titulo span {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gris);
    font-weight: 500;
  }

  .seccion-titulo::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(107,101,96,0.2);
  }

  .actividad {
    background: white;
    border-radius: 12px;
    padding: 11px 13px;
    margin-bottom: 7px;
    border-left: 3px solid var(--verde-claro);
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    display: flex;
    gap: 11px;
    align-items: flex-start;
  }

  .actividad.gastronomica { border-left-color: var(--dorado); }
  .actividad.traslado { border-left-color: #5b8a6e; background: #f7faf8; }

  .act-emoji { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

  .act-contenido p { font-size: 0.82rem; font-weight: 500; color: var(--texto); line-height: 1.35; }
  .act-contenido small { font-size: 0.7rem; color: var(--gris); margin-top: 3px; display: block; line-height: 1.4; }

  .tag {
    display: inline-block;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 10px;
    margin-top: 4px;
    font-weight: 500;
  }

  .tag-incluido { background: #e8f4ee; color: #2d6b54; }
  .tag-propio { background: #fef3e2; color: #c8763e; }

  .gastro-card {
    background: linear-gradient(135deg, #fef8ee 0%, #fdf3e3 100%);
    border: 1px solid rgba(200,150,62,0.25);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 7px;
  }

  .gastro-card .tipo {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dorado);
    font-weight: 500;
    margin-bottom: 3px;
  }

  .gastro-card strong { font-size: 0.85rem; display: block; color: var(--texto); margin-bottom: 3px; }
  .gastro-card p { font-size: 0.76rem; color: var(--gris); line-height: 1.45; }

  .nota {
    background: rgba(26,74,58,0.06);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 0.76rem;
    color: var(--verde);
    line-height: 1.5;
    border-left: 3px solid var(--verde-claro);
    margin-bottom: 10px;
  }

  /* CHAT */
  .chat-container {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    padding: 10px 14px 14px;
    background: linear-gradient(to top, var(--crema) 75%, transparent);
  }

  .chat-box {
    background: white;
    border-radius: 18px;
    box-shadow: 0 -4px 30px rgba(26,74,58,0.15), 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .chat-messages {
    max-height: 240px;
    overflow-y: auto;
    padding: 12px 13px;
    display: none;
    scrollbar-width: thin;
    scrollbar-color: var(--verde-claro) transparent;
  }

  .chat-messages.visible { display: block; }

  .msg {
    margin-bottom: 9px;
    display: flex;
    gap: 7px;
    align-items: flex-start;
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-bubble {
    max-width: 82%;
    padding: 8px 11px;
    border-radius: 14px;
    font-size: 0.8rem;
    line-height: 1.45;
  }

  .msg.assistant .msg-bubble { background: var(--crema); color: var(--texto); border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: var(--verde); color: var(--crema); border-bottom-right-radius: 4px; }

  .msg-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    flex-shrink: 0;
  }

  .msg.assistant .msg-avatar { background: var(--verde); color: var(--crema); }
  .msg.user .msg-avatar { background: var(--dorado); color: white; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 7px 12px 4px;
    border-top: 1px solid rgba(107,101,96,0.08);
  }

  .chip {
    background: var(--crema);
    border: 1px solid rgba(26,74,58,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.66rem;
    color: var(--verde);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover { background: var(--verde); color: var(--crema); border-color: var(--verde); }

  .chat-input-area {
    display: flex;
    gap: 8px;
    padding: 9px 12px;
    border-top: 1px solid rgba(107,101,96,0.1);
    align-items: center;
  }

  .chat-toggle {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  #chat-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.83rem;
    color: var(--texto);
    background: transparent;
    padding: 6px 0;
  }

  #chat-input::placeholder { color: rgba(107,101,96,0.45); }

  .send-btn {
    width: 32px; height: 32px;
    background: var(--verde);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--verde-claro); }
  .send-btn:disabled { background: rgba(107,101,96,0.3); cursor: not-allowed; }

  .loading-dots span {
    animation: blink 1.4s infinite;
    font-size: 1.1rem;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }
</style>
</head>

    <div class="chat-input-area">

let diaActivo = 0;
let chatAbierto = false;
let historialChat = [];
let cargando = false;

function renderNav() {
  const nav = document.getElementById('nav-dias');
  nav.innerHTML = ITINERARIO.map((d, i) =>
    `<button class="nav-btn ${i === diaActivo ? 'active' : ''}" onclick="cambiarDia(${i})">Día ${d.dia} · ${d.fecha}</button>`
  ).join('');
  // Scroll al botón activo
  setTimeout(() => {
    const btn = nav.children[diaActivo];
    if (btn) btn.scrollIntoView({ inline: 'center', block: 'nearest' });
  }, 50);
}

function renderDia(idx) {
  const d = ITINERARIO[idx];
  const contenedor = document.getElementById('contenido-dia');

  let html = `
    <div class="dia-hero">
      <div class="dia-numero">Día ${d.dia} de 10 · ${d.diaSemana}</div>
      <div class="dia-titulo">${d.titulo}</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px">
        <span class="dia-fecha">📍 ${d.subtitulo}</span>
        ${d.horario ? `<span class="horario-pill">⏰ ${d.horario}</span>` : ''}
      </div>
    </div>
    <div class="contenido">
      <div class="hotel-card">
        <div class="hotel-icon">🏨</div>
        <div class="hotel-info">
          <p>Alojamiento</p>
          <strong>${d.hotel.nombre} ${d.hotel.estrellas}</strong>
          <span>${d.hotel.detalle}</span>
        </div>
      </div>
  `;

  if (d.nota) html += `<div class="nota">💡 ${d.nota}</div>`;

  if (d.manana?.length) {
    html += `<div class="seccion"><div class="seccion-titulo"><span>☀️</span><span>Mañana</span></div>`;
    d.manana.forEach(a => { html += renderActividad(a); });
    html += `</div>`;
  }

  if (d.tarde?.length) {
    html += `<div class="seccion"><div class="seccion-titulo"><span>🌅</span><span>Tarde</span></div>`;
    d.tarde.forEach(a => { html += renderActividad(a); });
    html += `</div>`;
  }

  if (d.gastronomia?.length) {
    html += `<div class="seccion"><div class="seccion-titulo"><span>🍴</span><span>Gastronomía del día</span></div>`;
    d.gastronomia.forEach(g => {
      html += `<div class="gastro-card"><div class="tipo">${g.tipo}</div><strong>${g.nombre}</strong><p>${g.desc || ''}</p></div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  contenedor.innerHTML = html;
  window.scrollTo(0, 0);
}

function renderActividad(a) {
  const cls = a.tipo === 'gastro' ? 'gastronomica' : a.tipo === 'traslado' ? 'traslado' : '';
  const tag = a.incluido !== undefined
    ? `<span class="tag ${a.incluido ? 'tag-incluido' : 'tag-propio'}">${a.incluido ? 'Incluido' : 'Gasto propio'}</span>`
    : '';
  return `<div class="actividad ${cls}"><span class="act-emoji">${a.emoji}</span><div class="act-contenido"><p>${a.texto}</p>${a.detalle ? `<small>${a.detalle}</small>` : ''}${tag}</div></div>`;
}

function renderChips() {
  const d = ITINERARIO[diaActivo];
  const chips = [`¿Qué como hoy?`, `¿Qué está incluido?`, `Cuéntame sobre ${d.subtitulo.split(' · ')[0]}`, `Propina en España`, `Historia de Asturias`, `Contacto AsturiaMe`];
  document.getElementById('chips-container').innerHTML = chips.map(c =>
    `<button class="chip" onclick="enviarChip('${c}')">${c}</button>`
  ).join('');
}

function cambiarDia(idx) {
  diaActivo = idx;
  renderNav();
  renderDia(idx);
  renderChips();
}

function toggleChat() {
  chatAbierto = !chatAbierto;
  const msgs = document.getElementById('chat-messages');
  if (chatAbierto) {
    msgs.classList.add('visible');
    if (historialChat.length === 0) {
      agregarMensaje('assistant', `Hola Poncho. Estás en el Día ${ITINERARIO[diaActivo].dia}: <strong>${ITINERARIO[diaActivo].titulo}</strong>. ¿En qué te ayudo?`);
    }
  } else {
    msgs.classList.remove('visible');
  }
}

function agregarMensaje(rol, texto) {
  const container = document.getElementById('chat-messages');
  const avatar = rol === 'assistant' ? '⚜️' : 'P';
  const div = document.createElement('div');
  div.className = `msg ${rol}`;
  div.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-bubble">${texto}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function mostrarCargando() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg assistant'; div.id = 'loading-msg';
  div.innerHTML = `<div class="msg-avatar">⚜️</div><div class="msg-bubble"><span class="loading-dots"><span>·</span><span>·</span><span>·</span></span></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function quitarCargando() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

async function enviarMensaje(texto) {
  if (!texto.trim() || cargando) return;
  if (!chatAbierto) { chatAbierto = true; document.getElementById('chat-messages').classList.add('visible'); }

  agregarMensaje('user', texto);
  historialChat.push({ role: 'user', content: texto });
  document.getElementById('chat-input').value = '';
  document.getElementById('send-btn').disabled = true;
  cargando = true;
  mostrarCargando();

  const ctx = `\n\nContexto actual: el usuario está viendo el Día ${ITINERARIO[diaActivo].dia} (${ITINERARIO[diaActivo].fecha}, ${ITINERARIO[diaActivo].titulo} — ${ITINERARIO[diaActivo].subtitulo}).`;

  try {
    const response = await fetch('https://asturias-proxy.alfonso-gonzalez.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: CONTEXTO_CONCIERGE + ctx,
        messages: historialChat,
      })
    });

    const data = await response.json();
    quitarCargando();
    const respuesta = data.content?.[0]?.text || 'Sin respuesta. Intenta de nuevo.';
    agregarMensaje('assistant', respuesta);
    historialChat.push({ role: 'assistant', content: respuesta });
  } catch (err) {
    quitarCargando();
    agregarMensaje('assistant', 'Error de conexión. Verifica tu red e intenta de nuevo.');
  }

  cargando = false;
  document.getElementById('send-btn').disabled = false;
}

function enviarChip(texto) {
  document.getElementById('chat-input').value = texto;
  enviarMensaje(texto);
}

document.getElementById('send-btn').addEventListener('click', () => enviarMensaje(document.getElementById('chat-input').value));
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') enviarMensaje(e.target.value); });
document.getElementById('toggle-chat').addEventListener('click', toggleChat);

// Fecha
const now = new Date();
document.getElementById('fecha-display').textContent = now.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

// Detectar día activo
(function() {
  const inicio = new Date('2026-06-19');
  const hoy = new Date(); hoy.setHours(0,0,0,0); inicio.setHours(0,0,0,0);
  const diff = Math.floor((hoy - inicio) / 86400000);
  cambiarDia(diff >= 0 && diff < ITINERARIO.length ? diff : 0);
})();
</script>
